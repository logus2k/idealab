<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ideas Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>AI Ideas Lab</h1>
      <div class="view-toggle" role="tablist" aria-label="View">
        <button id="viewIdeas"        class="view-btn active" type="button" role="tab" aria-selected="true">Ideas</button>
        <button id="viewPlans"        class="view-btn"        type="button" role="tab" aria-selected="false">Plans</button>
        <button id="viewRequirements" class="view-btn"        type="button" role="tab" aria-selected="false">Requirements</button>
        <button id="viewKpis"         class="view-btn"        type="button" role="tab" aria-selected="false">KPIs</button>
        <button id="viewModels"       class="view-btn"        type="button" role="tab" aria-selected="false">Models</button>
        <button id="viewDatasets"     class="view-btn"        type="button" role="tab" aria-selected="false">Datasets</button>
        <button id="viewGraph"        class="view-btn"        type="button" role="tab" aria-selected="false">Graph</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Search title, description, source, or tag…" autocomplete="off" spellcheck="false" />
        <div class="result-count" id="resultCount">—</div>
      </div>
    </div>
  </header>

  <!-- Closable chips for currently-active filters; only rendered when at least
       one filter is on. Lives between the topbar and the main layout so the
       user can dismiss filters without opening the sidebar. -->
  <div id="activeSummary" class="active-filters-bar" hidden></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Filters</h2>
        <button id="clearFilters" class="ghost-btn" type="button">Clear all</button>
      </div>
      <div id="filterFacets"></div>
    </aside>

    <main class="content" id="content">
      <div id="loadingMsg" class="info-msg">Loading catalog…</div>
      <div id="errorMsg" class="error-msg" hidden></div>
      <div id="ideasContainer"></div>
      <div id="graphContainer" hidden>
        <div class="graph-topbar">
          <div id="graphBreadcrumb" class="graph-breadcrumb"></div>
          <div class="graph-topbar-spacer"></div>
          <div class="graph-hud-status" id="graphHudStatus">Click a node to expand its neighbors.</div>
          <button id="graphSettingsBtn" class="graph-settings-btn" type="button" aria-label="Graph settings" aria-haspopup="true" aria-expanded="false" title="Graph settings">
            <!-- inline gear, no font dep -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>
        </div>
        <div id="graphSettingsPanel" class="graph-settings-panel" hidden>
          <label class="graph-hud-control">
            <input id="graphShowNodeLabels" type="checkbox" checked />
            <span>Show node labels</span>
          </label>
          <label class="graph-hud-control">
            <input id="graphShowEdgeLabels" type="checkbox" />
            <span>Show edge labels</span>
          </label>
          <label class="graph-hud-control">
            <input id="graphShowLegend" type="checkbox" checked />
            <span>Show legend</span>
          </label>
          <label class="graph-hud-control">
            <input id="graphShowAll" type="checkbox" />
            <span>Show full graph</span>
          </label>
        </div>
        <div id="graphStage" class="graph-stage"></div>
        <div id="graphLegend" class="graph-legend" hidden></div>
      </div>
    </main>
  </div>

  <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Toggle filters">Filters</button>

  <div id="planModal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="planModalTitle">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div id="planModalContent"></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <!-- graph.js is loaded on demand by app.js when the Graph tab is first opened. -->
</body>
</html>
