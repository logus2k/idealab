<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Ideas Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>AI Ideas Lab</h1>
      <div class="view-toggle" role="tablist" aria-label="View">
        <button id="viewIdeas"        class="view-btn active" type="button" role="tab" aria-selected="true">Ideas</button>
        <button id="viewPlans"        class="view-btn"        type="button" role="tab" aria-selected="false">Plans</button>
        <button id="viewRequirements" class="view-btn"        type="button" role="tab" aria-selected="false">Requirements</button>
        <button id="viewKpis"         class="view-btn"        type="button" role="tab" aria-selected="false">KPIs</button>
        <button id="viewModels"       class="view-btn"        type="button" role="tab" aria-selected="false">Models</button>
        <button id="viewDatasets"     class="view-btn"        type="button" role="tab" aria-selected="false">Datasets</button>
        <button id="viewGraph"        class="view-btn"        type="button" role="tab" aria-selected="false">Graph</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="search" placeholder="Search title, description, source, or tag…" autocomplete="off" spellcheck="false" />
        <div class="result-count" id="resultCount">—</div>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Filters</h2>
        <button id="clearFilters" class="ghost-btn" type="button">Clear all</button>
      </div>
      <div class="active-summary" id="activeSummary"></div>
      <div id="filterFacets"></div>
    </aside>

    <main class="content" id="content">
      <div id="loadingMsg" class="info-msg">Loading catalog…</div>
      <div id="errorMsg" class="error-msg" hidden></div>
      <div id="ideasContainer"></div>
      <div id="graphContainer" hidden>
        <div id="graphBreadcrumb" class="graph-breadcrumb"></div>
        <div id="graphStage" class="graph-stage"></div>
        <div id="graphHud" class="graph-hud">
          <div class="graph-hud-status" id="graphHudStatus">Click a node to expand its neighbors.</div>
          <label class="graph-hud-control">
            <span>Edge labels at zoom</span>
            <input id="graphEdgeLabelZoom" type="range" min="50" max="600" step="10" value="180" />
            <span class="graph-hud-value" id="graphEdgeLabelZoomVal">180</span>
          </label>
          <label class="graph-hud-control">
            <input id="graphShowAll" type="checkbox" />
            <span>Show full graph</span>
          </label>
        </div>
      </div>
    </main>
  </div>

  <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="Toggle filters">Filters</button>

  <div id="planModal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="planModalTitle">
      <button class="modal-close" type="button" data-close aria-label="Close">×</button>
      <div id="planModalContent"></div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <!-- graph.js is loaded on demand by app.js when the Graph tab is first opened. -->
</body>
</html>
